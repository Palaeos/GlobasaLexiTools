<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globasa PoS Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Reset & Base — mirrors tmx_viewer.html
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-sans: 'Open Sans', system-ui, sans-serif;
  --body-size: 18px;
  --lh: 1.45;
  --color-text: #333;
  --color-muted: #666;
  --color-bg: #fafafa;
  --color-surface: #fff;
  --color-border: #e0e0e0;
  --color-link: #1a5fb4;
  --radius: 6px;
  --max-width: 90ch;
  --color-header-bg: #d5edcf;
  --color-header-text: #2a5a1e;
  --color-footer-bg: #1a3a6b;
  --color-footer-text: #fff;
  --color-search-btn: #4a8c3f;

  /* PoS palette (light)
     Family-grouped: similar functions share a hue. The subscript label
     carries the unambiguous tag — colour is for visual scanning.
     Cool family: nouns / pronouns / phrases (blue-purple).
     Warm family: prepositions / determiners / numbers (sienna-amber-olive).
     Verbs are red; adjectives green; adverbs teal. Punctuation is muted. */
  --pos-N:       #1e4d8a;  --pos-N-bg:     #d8e4f6;
  --pos-V:       #a02828;  --pos-V-bg:     #fad6d6;
  --pos-ADJ:     #1e6a3a;  --pos-ADJ-bg:   #d2e8d8;
  --pos-ADV:     #1e6a6a;  --pos-ADV-bg:   #d2e8e8;
  --pos-PRON:    #5a3a8c;  --pos-PRON-bg:  #e3deef;
  --pos-PROPN:   #2a5a1e;  --pos-PROPN-bg: #dceacb;
  --pos-PREP:    #8a4a08;  --pos-PREP-bg:  #fde4c4;
  --pos-POSTP:   #8a4a08;  --pos-POSTP-bg: #fde4c4;
  --pos-DET:     #a16a10;  --pos-DET-bg:   #fceec0;
  --pos-POSS:    #a16a10;  --pos-POSS-bg:  #fceec0;
  --pos-NUM:     #6a6a08;  --pos-NUM-bg:   #ececc0;
  --pos-PAR:     #4b3a8c;  --pos-PAR-bg:   #e3deef;
  --pos-CONJ:    #555;     --pos-CONJ-bg:  #ececec;
  --pos-INTJ:    #a02060;  --pos-INTJ-bg:  #fad2e3;
  --pos-PHRS:    #1e4d8a;  --pos-PHRS-bg:  #d8e4f6;
  --pos-PFX:     #8a4a08;  --pos-PFX-bg:   #fde4c4;
  --pos-SFX:     #a13e10;  --pos-SFX-bg:   #fcd9c0;
  --pos-UNK:     #777;     --pos-UNK-bg:   #f3f3f3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-text: #e8e8e8;
    --color-muted: #aaa;
    --color-bg: #1a1a1a;
    --color-surface: #252525;
    --color-border: #444;
    --color-link: #7cb4f8;
    --color-header-bg: #1e3318;
    --color-header-text: #b0d8a8;
    --color-footer-bg: #0e1f3d;
    --color-footer-text: #ccc;
    --color-search-btn: #3a6c30;

    --pos-N:       #b8d2f5;  --pos-N-bg:     #1d2a44;
    --pos-V:       #f5b0b0;  --pos-V-bg:     #3a1818;
    --pos-ADJ:     #a8d8b6;  --pos-ADJ-bg:   #1d3326;
    --pos-ADV:     #a8d8d8;  --pos-ADV-bg:   #1d3333;
    --pos-PRON:    #d6c4f0;  --pos-PRON-bg:  #2a2240;
    --pos-PROPN:   #c0e8a8;  --pos-PROPN-bg: #1f3320;
    --pos-PREP:    #f5cf95;  --pos-PREP-bg:  #3a2810;
    --pos-POSTP:   #f5cf95;  --pos-POSTP-bg: #3a2810;
    --pos-DET:     #f5d985;  --pos-DET-bg:   #3a3010;
    --pos-POSS:    #f5d985;  --pos-POSS-bg:  #3a3010;
    --pos-NUM:     #d8d870;  --pos-NUM-bg:   #2a2a10;
    --pos-PAR:     #c4b8e8;  --pos-PAR-bg:   #2a2240;
    --pos-CONJ:    #aaa;     --pos-CONJ-bg:  #2c2c2c;
    --pos-INTJ:    #f5b0d0;  --pos-INTJ-bg:  #3a1f30;
    --pos-PHRS:    #b8d2f5;  --pos-PHRS-bg:  #1d2a44;
    --pos-PFX:     #f5cf95;  --pos-PFX-bg:   #3a2810;
    --pos-SFX:     #f4c0a0;  --pos-SFX-bg:   #3d1f10;
    --pos-UNK:     #aaa;     --pos-UNK-bg:   #2a2a2a;
  }
}

html { font-size: var(--body-size); }
body {
  font-family: var(--font-sans);
  line-height: var(--lh);
  color: var(--color-text);
  background: var(--color-bg);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
a { color: var(--color-link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ============================================================
   Header / footer (matches tmx_viewer.html)
   ============================================================ */
.site-header {
  background: var(--color-header-bg);
  color: var(--color-header-text);
  padding: 0.5rem 1rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.site-brand {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-weight: 700;
  font-size: 1.1rem;
  white-space: nowrap;
}
.site-nav {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.15rem;
  font-size: 0.82rem;
}
.site-nav a { color: var(--color-header-text); }
.nav-sep { color: var(--color-header-text); opacity: 0.5; user-select: none; }

.site-footer {
  background: var(--color-footer-bg);
  text-align: center;
  padding: 0.6rem 1rem;
  color: var(--color-footer-text);
}
.site-footer .footer-inner {
  max-width: var(--max-width);
  margin: 0 auto;
}

/* ============================================================
   Main / controls / pagination (mirrors tmx_viewer.html)
   ============================================================ */
main {
  flex: 1;
  max-width: var(--max-width);
  width: 100%;
  margin: 0 auto;
  padding: 1rem;
}
.controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
  padding: 0.6rem 0.8rem;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}
.controls label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--color-muted);
}
.controls select,
.controls input[type="text"] {
  font-family: var(--font-sans);
  font-size: 0.9rem;
  padding: 0.3rem 0.5rem;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
  color: var(--color-text);
}
.controls select { min-width: 9rem; }
.controls input[type="text"] { min-width: 11rem; }

.pagination {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-left: auto;
}
.pagination button {
  font-family: var(--font-sans);
  font-size: 0.85rem;
  padding: 0.3rem 0.6rem;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  color: var(--color-text);
  cursor: pointer;
}
.pagination button:disabled {
  opacity: 0.4;
  cursor: default;
}
.page-info {
  font-size: 0.82rem;
  color: var(--color-muted);
  white-space: nowrap;
}

/* ============================================================
   Legend (PoS-tag colour key)
   ============================================================ */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem 0.6rem;
  margin-bottom: 0.8rem;
  padding: 0.5rem 0.7rem;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  font-size: 0.78rem;
}
.legend .legend-item {
  display: inline-flex;
  align-items: baseline;
  gap: 0.15rem;
}

/* ============================================================
   Entry cards (mirrors tmx_viewer.html)
   ============================================================ */
#entries {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.entry-card {
  display: grid;
  grid-template-columns: 2.5rem 1fr;
  gap: 0 0.6rem;
  padding: 0.6rem 0.8rem;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}
.entry-idx {
  grid-row: 1 / span 2;
  color: var(--color-muted);
  font-size: 0.8rem;
  padding-top: 0.15rem;
  text-align: right;
  user-select: none;
}
.entry-ctx {
  font-style: italic;
  font-size: 0.75rem;
}
.entry-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.05rem 0.35rem;
  line-height: 1.9;          /* roomier so subscripts don't crowd next line */
}
.row-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--color-muted);
  margin-right: 0.15rem;
  user-select: none;
}

/* ============================================================
   Tokens — the chip-with-subscript primitive
   ============================================================
   Each whole word is one .tok span carrying the surface text plus a
   <sub class="pos-tag"> with the abbreviation. Trailing punctuation is
   emitted as a bare text node *outside* the chip so it sticks to the
   word visually but isn't styled as part of the chip.
   ============================================================ */
.tok {
  display: inline-block;
  padding: 0.05rem 0.35rem;
  border-radius: 4px;
  font-weight: 600;
  cursor: default;
  transition: filter 0.12s;
  white-space: nowrap;
  /* Tight bottom padding so the subscript sits flush under the word. */
  padding-bottom: 0;
}
.tok:hover { filter: brightness(1.10); }
@media (prefers-color-scheme: dark) {
  .tok:hover { filter: brightness(1.30); }
}

.pos-tag {
  display: inline-block;
  margin-left: 0.18rem;
  font-size: 0.62em;
  font-weight: 700;
  letter-spacing: 0.02em;
  vertical-align: sub;
  opacity: 0.78;
  user-select: none;
}

/* When labels are toggled off, hide every subscript. */
body.no-labels .pos-tag { display: none; }

/* Tooltip: tag name + lemma (when known) */
.tok[title] { cursor: help; }

/* Click-through to dictionary for content tokens with a known lemma. */
.tok[data-link="1"] { cursor: pointer; }

/* PROPN gets italics so capitalisation feels less shouty. */
.tok[data-pos="PROPN"] { font-style: italic; }

/* UNK is muted — less alarming for unknown / out-of-vocabulary tokens. */
.tok[data-pos="UNK"] { font-weight: 400; font-style: italic; }

/* Per-PoS colours.
   These mirror the --pos-*/--pos-*-bg custom-property pairs above so
   the legend swatches and the actual tokens share a single source of
   truth — change the colour in :root and both update. */
.tok[data-pos="N"]      { color: var(--pos-N);      background: var(--pos-N-bg); }
.tok[data-pos="V"]      { color: var(--pos-V);      background: var(--pos-V-bg); }
.tok[data-pos="ADJ"]    { color: var(--pos-ADJ);    background: var(--pos-ADJ-bg); }
.tok[data-pos="ADV"]    { color: var(--pos-ADV);    background: var(--pos-ADV-bg); }
.tok[data-pos="PRON"]   { color: var(--pos-PRON);   background: var(--pos-PRON-bg); }
.tok[data-pos="PROPN"]  { color: var(--pos-PROPN);  background: var(--pos-PROPN-bg); }
.tok[data-pos="PREP"]   { color: var(--pos-PREP);   background: var(--pos-PREP-bg); }
.tok[data-pos="POSTP"]  { color: var(--pos-POSTP);  background: var(--pos-POSTP-bg); }
.tok[data-pos="DET"]    { color: var(--pos-DET);    background: var(--pos-DET-bg); }
.tok[data-pos="POSS"]   { color: var(--pos-POSS);   background: var(--pos-POSS-bg); }
.tok[data-pos="NUM"]    { color: var(--pos-NUM);    background: var(--pos-NUM-bg); }
.tok[data-pos="PAR"]    { color: var(--pos-PAR);    background: var(--pos-PAR-bg); }
.tok[data-pos="CONJ"]   { color: var(--pos-CONJ);   background: var(--pos-CONJ-bg); }
.tok[data-pos="INTJ"]   { color: var(--pos-INTJ);   background: var(--pos-INTJ-bg); }
.tok[data-pos="PHRS"]   { color: var(--pos-PHRS);   background: var(--pos-PHRS-bg); }
.tok[data-pos="PFX"]    { color: var(--pos-PFX);    background: var(--pos-PFX-bg); }
.tok[data-pos="SFX"]    { color: var(--pos-SFX);    background: var(--pos-SFX-bg); }
.tok[data-pos="UNK"]    { color: var(--pos-UNK);    background: var(--pos-UNK-bg); }

/* Punctuation that travels with a word (.tok-trail) — plain text, no chip. */
.tok-trail { color: var(--color-muted); white-space: pre; }

/* Target side: plain text */
.tgt-row .target-text {
  font-size: 0.95rem;
  color: var(--color-text);
}

/* Labels-toggle checkbox */
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.82rem;
  color: var(--color-muted);
  user-select: none;
  cursor: pointer;
}

/* ============================================================
   Status messages
   ============================================================ */
.status-msg {
  text-align: center;
  color: var(--color-muted);
  padding: 2rem;
  font-size: 0.95rem;
}
.status-msg.error { color: #c0392b; }
</style>
</head>

  </div>

<footer class="site-footer">
  <div class="footer-inner">
    Globasa PoS Viewer — whole-word part-of-speech tagging
  </div>
</footer>

<script>
(function() {
  "use strict";

  /* ── Language names ─────────────────────────────────────── */
  const LANG_NAMES = {
    en: "English", eo: "Esperanto", es: "Spanish", de: "German", fr: "French",
    ru: "Russian", nl: "Dutch", pt: "Portuguese", id: "Indonesian", da: "Danish",
    ar: "Arabic", hi: "Hindi", sw: "Swahili", tr: "Turkish", zh: "Chinese",
    ja: "Japanese", ko: "Korean", vi: "Vietnamese"
  };

  /* ── State ──────────────────────────────────────────────── */
  let currentLang    = "";
  let currentContext = "";
  let currentPage    = 1;
  let totalPages     = 1;
  let searchQuery    = "";
  let debounceTimer  = null;

  /* ── DOM refs ───────────────────────────────────────────── */
  const langSelect    = document.getElementById("lang-select");
  const contextSelect = document.getElementById("context-select");
  const searchInput   = document.getElementById("search-input");
  const labelsToggle  = document.getElementById("labels-toggle");
  const entriesDiv    = document.getElementById("entries");
  const statusMsg     = document.getElementById("status-msg");
  const prevBtn       = document.getElementById("prev-btn");
  const nextBtn       = document.getElementById("next-btn");
  const pageInfo      = document.getElementById("page-info");
  const legendDiv     = document.getElementById("legend");

  /* ── Init: fetch tag inventory and build the legend ─────── */
  fetch("/api/pos/tags")
    .then(r => r.json())
    .then(tags => {
      legendDiv.innerHTML = "";
      tags.forEach(t => {
        const item = document.createElement("span");
        item.className = "legend-item";
        const tok = document.createElement("span");
        tok.className = "tok";
        tok.dataset.pos = t.tag;
        tok.title = t.name;
        tok.textContent = t.tag;
        const sub = document.createElement("sub");
        sub.className = "pos-tag";
        sub.textContent = t.name;
        tok.appendChild(sub);
        item.appendChild(tok);
        legendDiv.appendChild(item);
      });
    })
    .catch(() => {});

  /* ── Init: fetch available languages ────────────────────── */
  fetch("/api/pos/languages")
    .then(r => r.json())
    .then(langs => {
      if (!langs.length) {
        statusMsg.textContent = "No corpus data available.";
        return;
      }
      langs.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.lang;
        const label = LANG_NAMES[item.lang] || item.lang;
        opt.textContent = item.count == null ? label : `${label} (${item.count})`;
        langSelect.appendChild(opt);
      });
      const preferred = langs.find(l => l.lang === "en") || langs[0];
      currentLang = preferred.lang;
      langSelect.value = currentLang;
      loadContexts();
      loadEntries();
    })
    .catch(() => {
      statusMsg.textContent = "Failed to load languages.";
      statusMsg.classList.add("error");
    });

  function loadContexts() {
    contextSelect.innerHTML = '<option value="">All</option>';
    fetch("/api/pos/contexts?lang=" + encodeURIComponent(currentLang))
      .then(r => r.json())
      .then(contexts => {
        contexts.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.context;
          opt.textContent = `${c.context} (${c.count})`;
          contextSelect.appendChild(opt);
        });
      })
      .catch(() => {});
  }

  /* ── Event listeners ────────────────────────────────────── */
  langSelect.addEventListener("change", () => {
    currentLang = langSelect.value;
    currentContext = "";
    currentPage = 1;
    loadContexts();
    loadEntries();
  });
  contextSelect.addEventListener("change", () => {
    currentContext = contextSelect.value;
    currentPage = 1;
    loadEntries();
  });
  searchInput.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      searchQuery = searchInput.value.trim();
      currentPage = 1;
      loadEntries();
    }, 300);
  });
  prevBtn.addEventListener("click", () => {
    if (currentPage > 1) { currentPage--; loadEntries(); }
  });
  nextBtn.addEventListener("click", () => {
    if (currentPage < totalPages) { currentPage++; loadEntries(); }
  });
  labelsToggle.addEventListener("change", () => {
    document.body.classList.toggle("no-labels", !labelsToggle.checked);
  });

  /* Click a content token → jump to dictionary (when a lemma is known). */
  entriesDiv.addEventListener("click", e => {
    const t = e.target.closest(".tok[data-link='1']");
    if (!t) return;
    const lemma = t.dataset.lemma;
    if (!lemma) return;
    window.open("/?word=" + encodeURIComponent(lemma), "_blank");
  });

  /* ── Fetch & render ─────────────────────────────────────── */
  function loadEntries() {
    if (!currentLang) return;
    const params = new URLSearchParams({
      lang: currentLang,
      page: currentPage,
      per_page: 50,
    });
    if (searchQuery) params.set("q", searchQuery);
    if (currentContext) params.set("context", currentContext);

    statusMsg.textContent = "Loading…";
    statusMsg.classList.remove("error");
    statusMsg.style.display = "";
    entriesDiv.querySelectorAll(".entry-card").forEach(c => c.remove());

    fetch("/api/pos?" + params)
      .then(r => r.json())
      .then(renderData)
      .catch(() => {
        statusMsg.textContent = "Failed to load entries.";
        statusMsg.classList.add("error");
      });
  }

  /* PoS classes whose lemma is worth a dictionary lookup. Function words,
     punctuation and unknowns are not — clicking them just confuses. */
  const LINKABLE_POS = new Set([
    "N", "V", "ADJ", "ADV", "PROPN", "PHRS", "PFX", "SFX",
  ]);

  function renderData(data) {
    const perPage = data.per_page || 50;
    totalPages = Math.max(1, Math.ceil(data.total / perPage));
    currentPage = data.page;

    pageInfo.textContent = `Page ${currentPage} of ${totalPages} (${data.total} entries)`;
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;

    if (!data.entries || !data.entries.length) {
      statusMsg.textContent = "No entries found.";
      statusMsg.style.display = "";
      return;
    }
    statusMsg.style.display = "none";

    data.entries.forEach((entry, i) => {
      const card = document.createElement("div");
      card.className = "entry-card";

      const idxEl = document.createElement("div");
      idxEl.className = "entry-idx";
      idxEl.textContent = entry.id != null ? (entry.id + 1) : ((currentPage - 1) * perPage + i + 1);
      if (entry.context) {
        const ctxEl = document.createElement("span");
        ctxEl.className = "entry-ctx";
        ctxEl.textContent = " — " + entry.context;
        idxEl.appendChild(ctxEl);
      }
      card.appendChild(idxEl);

      /* Globasa row: PoS-tagged token chips */
      const glbRow = document.createElement("div");
      glbRow.className = "entry-row glb-row";
      const glbLabel = document.createElement("span");
      glbLabel.className = "row-label";
      glbLabel.textContent = "GLB";
      glbRow.appendChild(glbLabel);

      (entry.glb_pos_tokens || []).forEach(t => {
        const chip = document.createElement("span");
        chip.className = "tok";
        chip.dataset.pos = t.pos || "UNK";
        chip.dataset.lemma = t.lemma || "";
        // Tooltip: full PoS name + lemma when distinct from surface
        const lem = (t.lemma || "").toLowerCase();
        const surf = (t.surface || "").toLowerCase();
        const baseTip = chip.dataset.pos;
        chip.title = (t.lemma && lem !== surf)
          ? `${baseTip} — ${t.lemma}`
          : baseTip;
        if (LINKABLE_POS.has(chip.dataset.pos) && t.lemma) {
          chip.dataset.link = "1";
        }
        chip.textContent = t.surface;
        const sub = document.createElement("sub");
        sub.className = "pos-tag";
        sub.textContent = t.pos || "UNK";
        chip.appendChild(sub);
        glbRow.appendChild(chip);

        if (t.trail) {
          const tr = document.createElement("span");
          tr.className = "tok-trail";
          tr.textContent = t.trail;
          glbRow.appendChild(tr);
        }
      });
      card.appendChild(glbRow);

      /* Target (gloss) row: plain text */
      const tgtRow = document.createElement("div");
      tgtRow.className = "entry-row tgt-row";
      const tgtLabel = document.createElement("span");
      tgtLabel.className = "row-label";
      tgtLabel.textContent = (LANG_NAMES[data.lang] || data.lang).substring(0, 3).toUpperCase();
      tgtRow.appendChild(tgtLabel);
      const tgtText = document.createElement("span");
      tgtText.className = "target-text";
      tgtText.textContent = entry.target_text || "";
      tgtRow.appendChild(tgtText);
      card.appendChild(tgtRow);

      entriesDiv.appendChild(card);
    });
  }
})();
</script>
</body>
</html>
