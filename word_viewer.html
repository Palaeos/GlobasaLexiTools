// Translation table builder
// ============================================================

// Show this many images per sense before the "+N more" control.
// A row's pictures occupy a fixed box, the size one image would take, however
// many there are — so an illustrated row never grows taller than a plain one.
// Up to four tile into it; the rest are reachable by expanding.
const TILE_MAX = 4;

// The expanded view: every image for this row, grouped by sense, with labels
// and attribution. This is where a word with many pictures is actually read.
function showGalleryOverlay(senses, heading) {
  const ov = document.createElement("div");
  ov.className = "img-overlay";

  const panel = document.createElement("div");
  panel.className = "gallery-panel";
  panel.addEventListener("click", e => e.stopPropagation());

  const close = () => ov.remove();

  const bar = document.createElement("div");
  bar.className = "gallery-panel-bar";
  if (heading) {
    const h = document.createElement("div");
    h.className = "gallery-panel-heading";
    h.textContent = heading;
    bar.appendChild(h);
  }
  const shut = document.createElement("button");
  shut.type = "button";
  shut.className = "gallery-panel-close";
  shut.textContent = "\u00d7";
  shut.title = "Close";
  shut.setAttribute("aria-label", "Close gallery");
  shut.addEventListener("click", close);
  bar.appendChild(shut);
  panel.appendChild(bar);

  const withImages = senses.filter(sn => (sn.images || []).length > 0);
  const showLabels = withImages.length > 1;
  withImages.forEach(sense => {
    if (showLabels && sense.label) {
      const lab = document.createElement("div");
      lab.className = "gallery-panel-label";
      lab.textContent = sense.label;
      panel.appendChild(lab);
    }
    const strip = document.createElement("div");
    strip.className = "gallery-panel-strip";
    (sense.images || []).forEach(im => {
      const fig = document.createElement("figure");
      const a = document.createElement("a");
      a.href = im.source_page || im.url;
      a.target = "_blank";
      a.rel = "noopener";
      const img = document.createElement("img");
      img.src = im.url;
      img.alt = im.word || "";
      img.loading = "lazy";
      a.appendChild(img);
      fig.appendChild(a);
      if (im.word) {
        const cap = document.createElement("figcaption");
        cap.className = "gallery-panel-caption";
        cap.textContent = convertScript(im.word);
        fig.appendChild(cap);
      }
      strip.appendChild(fig);
    });
    panel.appendChild(strip);
  });

  ov.appendChild(panel);
  ov.addEventListener("click", close);
  document.addEventListener("keydown", function esc(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); }
  });
  document.body.appendChild(ov);
}

// The compact tile. One image fills the box; two split it; three or more grid
// into it, with a "+N" badge when there are more than fit. Clicking anywhere
// opens the full gallery.
function buildImageTile(senses, heading) {
  const images = senses.reduce((acc, sn) => acc.concat(sn.images || []), []);
  if (images.length === 0) return null;

  const tile = document.createElement("div");
  const shown = Math.min(images.length, TILE_MAX);
  tile.className = `img-tile n${shown}`;
  tile.title = images.length > 1
    ? `${images.length} images — click to expand`
    : "click to expand";

  images.slice(0, TILE_MAX).forEach((im, i) => {
    const cell = document.createElement("span");
    cell.className = "img-tile-cell";
    const img = document.createElement("img");
    img.src = im.url;
    img.alt = "";
    img.loading = "lazy";
    cell.appendChild(img);
    // Any overflow is announced on the last visible cell.
    const hidden = images.length - TILE_MAX;
    if (hidden > 0 && i === TILE_MAX - 1) {
      const badge = document.createElement("span");
      badge.className = "img-tile-badge";
      badge.textContent = `+${hidden}`;
      cell.appendChild(badge);
    }
    tile.appendChild(cell);
  });

  tile.addEventListener("click", () => showGalleryOverlay(senses, heading));
  return tile;
}

// Does this word have any images at all? Used to decide whether the table
// grows an image column -- most words have none and must look untouched.
function hasAnyImages(data) {
  const groups = (data.translations && data.translations.pos_groups) || [];
  return groups.some(g => (g.image_senses || []).some(sn => (sn.images || []).length > 0)) ||
         (data.image_senses || []).some(sn => (sn.images || []).length > 0);
}

// The image cell for one PoS row. The gloss is not repeated here -- it is in
// the English cell of this same row, which is the whole point of putting the
// pictures in the table.
function buildImageCell(pg, data, cssClass) {
  const td = document.createElement("td");
  td.className = `cell-images ${cssClass}`;
  const senses = (pg.image_senses || []).filter(sn => (sn.images || []).length > 0);
  if (senses.length === 0) {
    td.innerHTML = "<span style='color:var(--color-muted)'>—</span>";
    return td;
  }
  const heading = `${data.word} — ${grammarLabel(pg.pos, selectedLangs[0] || "English")}` +
    (pg.register ? ` (${pg.register})` : "");
  const blocks = buildImageTile(senses, heading);
  // The flag is on the sense, so only a row holding an explicit sense is
  // covered: melon's fruit stays visible, its vulgar sense would not.
  if (senses.some(sn => sn.nsfw)) {
    // The cover has to hide every picture in the cell, not just the first.
    const det = document.createElement("details");
    det.className = "nsfw-wrap";
    const sum = document.createElement("summary");
    sum.textContent = "⚠ NSFW image — click to reveal";
    det.appendChild(sum);
    det.appendChild(blocks);
    td.appendChild(det);
  } else {
    td.appendChild(blocks);
  }
  return td;
}

function buildTransTable(data) {
  const { has_verbs, pos_groups } = data.translations;
  // Globasa is a UI-only language — exclude it from translation table columns
  const tableLangs = selectedLangs.filter(l => l !== "Globasa");
  const langs = tableLangs.length > 0 ? tableLangs : ["German"];

  // Use the actual first selected language (including Globasa) for UI/grammar labels
  const firstLang = selectedLangs.length > 0 ? selectedLangs[0] : langs[0];
  const isRTL = RTL_LANGS.has(firstLang);

  const table = document.createElement("table");
  table.className = "trans-table";
  if (isRTL) table.setAttribute("dir", "rtl");

  // Header row
  const thead = table.createTHead();
  const hrow = thead.insertRow();

  function makeHeader(text) {
    const th = document.createElement("th");
    th.textContent = text;
    return th;
  }

  const langHeaders = langs.map(l => makeHeader(langName(l)));
  const posHeaderLabel = makeHeader(uiLabel("pos"));
  const typeHeaderLabel = makeHeader(uiLabel("type"));

  // Only illustrated words grow an image column; everything else is unchanged.
  const showImages = hasAnyImages(data);

  // The second column carries a verb's transitivity AND a noun's register
  // (slang/vulgar/sexual), so it is needed whenever either is present -- a word
  // like `gigi`, informal-only with no verb, still needs it.
  const hasRegisters = pos_groups.some(g => g.register);
  const showTypeCol = has_verbs || hasRegisters;

  // Always append in logical order: PoS, Type, Lang(s), Image
  // dir="rtl" on the table handles visual reversal for RTL languages
  hrow.appendChild(posHeaderLabel);
  if (showTypeCol) hrow.appendChild(typeHeaderLabel);
  langHeaders.forEach(h => hrow.appendChild(h));
  if (showImages) hrow.appendChild(makeHeader(uiLabel("image")));

  // Body
  const tbody = table.createTBody();

  // A sense marked `also_pos` illustrates several parts of speech at once --
  // a noun that is simply the act of its verb, `awcu` "disappearance /
  // disappear". Its images are attached to every such group, so consecutive
  // groups carrying the same share id get ONE image cell spanning their rows
  // rather than the same photograph printed twice.
  const shareOf = pg => ((pg.image_senses || []).find(sn => sn.share) || {}).share;
  const imageSpan = pos_groups.map(() => 1);
  const imageSkip = pos_groups.map(() => false);
  for (let a = 0; a < pos_groups.length; a++) {
    const id = shareOf(pos_groups[a]);
    if (!id || imageSkip[a]) continue;
    let b = a + 1;
    while (b < pos_groups.length && shareOf(pos_groups[b]) === id) { imageSkip[b] = true; b++; }
    imageSpan[a] = b - a;
  }

  // Group consecutive rows sharing a part of speech so the PoS cell can rowspan
  // them, exactly as the verb rows have always done. A noun's registers are
  // sub-rows of "Noun" the way transitive/intransitive are sub-rows of "Verb".
  const runKey = pos => (pos === "verb" || pos === "verb phrase") ? "verb" : pos;

  let i = 0;
  while (i < pos_groups.length) {
    const key = runKey(pos_groups[i].pos);
    const run = [];
    const runAt = [];
    while (i < pos_groups.length && runKey(pos_groups[i].pos) === key) {
      runAt.push(i);
      run.push(pos_groups[i]);
      i++;
    }
    const cssClass = posCssClass(run[0].pos);
    // Nothing to say in the type column for this run: let the PoS cell span it,
    // which is how a plain noun row has always looked.
    const runHasType = run.some(g => g.verb_type || g.register);

    run.forEach((pg, k) => {
      const tr = tbody.insertRow();

      if (k === 0) {
        const tdPos = document.createElement("td");
        tdPos.className = `cell-pos ${cssClass}`;
        tdPos.textContent = grammarLabel(key, firstLang);
        if (run.length > 1) tdPos.rowSpan = run.length;
        if (showTypeCol && !runHasType) tdPos.colSpan = 2;
        tr.appendChild(tdPos);
      }

      if (showTypeCol && runHasType) {
        const tdType = document.createElement("td");
        tdType.className = `cell-verbtype ${cssClass}`;
        tdType.textContent = pg.verb_type
          ? verbTypeLabel(pg.verb_type, firstLang)
          : (pg.register || "");
        tr.appendChild(tdType);
      }

      langs.forEach(lang => {
        tr.appendChild(buildLangCell(pg, lang, cssClass));
      });
      if (showImages && !imageSkip[runAt[k]]) {
        const td = buildImageCell(pg, data, cssClass);
        if (imageSpan[runAt[k]] > 1) td.rowSpan = imageSpan[runAt[k]];
        tr.appendChild(td);
      }
    });
  }

  return table;
}

function buildLangCell(pg, lang, cssClass) {
  const td = document.createElement("td");
  td.className = `cell-trans ${cssClass}`;
  td.dir = RTL_LANGS.has(lang) ? "rtl" : "ltr";

  const items = (pg.languages && pg.languages[lang]) || [];
  if (items.length === 0) {
    td.innerHTML = "<span style='color:var(--color-muted)'>—</span>";
    return td;
  }

  // Flatten: split items that contain commas into separate sub-items
  const flat = [];
  items.forEach(item => {
    const parts = item.text.split(/,\s*/);
    parts.forEach(p => {
      if (p) flat.push({text: p.trim(), gender: item.gender});
    });
  });

  flat.forEach((item, i) => {
    const span = document.createElement("span");
    span.className = "trans-item";
    span.innerHTML = renderGenderedWord(item.text, item.gender, lang);
    td.appendChild(span);
  });
  return td;
}

// ============================================================
// Mini translation table (single language, no header, compact)
// Used for tag browser items and derived word previews
// ============================================================

// Short PoS abbreviations for compact display
const POS_ABBREV = {
  "noun": "n", "proper noun": "n.pr", "verb": "v", "verb phrase": "v.phr",
  "adjective": "adj", "proper adjective": "adj.pr", "verbal adverb": "v.adv",
  "adverb": "adv", "interjection": "interj", "pronoun": "pron",
  "number": "num", "preposition": "prep", "phrasal preposition": "prep.phr",
  "prepositional phrase": "prep.phr", "postposition": "postp",
  "conjunction": "conj", "phrasal conjunction": "conj.phr",
  "conjunction phrase": "conj.phr", "determiner": "det", "particle": "part",
  "prefix": "pfx", "phrase": "phr", "noun phrase": "n.phr",
  "adjective phrase": "adj.phr", "phrasal adverb": "adv.phr",
  "possessive pronoun": "poss.pron", "possessive adjective": "poss.adj",
};

function buildMiniTransTable(data) {
  const { has_verbs, pos_groups } = data.translations;
  // Use only the first non-Globasa display language
  const tableLangs = selectedLangs.filter(l => l !== "Globasa");
  const lang = tableLangs.length > 0 ? tableLangs[0] : "English";
  const firstLang = selectedLangs.length > 0 ? selectedLangs[0] : lang;

  const table = document.createElement("table");
  table.className = "trans-table mini-trans";
  if (RTL_LANGS.has(firstLang)) table.setAttribute("dir", "rtl");

  // No header row — keep it compact
  const tbody = table.createTBody();

  let i = 0;
  while (i < pos_groups.length) {
    const pg = pos_groups[i];
    const cssClass = posCssClass(pg.pos);

    if (pg.pos === "verb" || pg.pos === "verb phrase") {
      let verbRows = [];
      let j = i;
      while (j < pos_groups.length && (pos_groups[j].pos === "verb" || pos_groups[j].pos === "verb phrase")) {
        verbRows.push(pos_groups[j]);
        j++;
      }
      verbRows.forEach((vg, vi) => {
        const tr = tbody.insertRow();
        if (vi === 0) {
          const tdPos = document.createElement("td");
          tdPos.className = `cell-pos ${cssClass}`;
          tdPos.rowSpan = verbRows.length;
          tdPos.textContent = POS_ABBREV["verb"] || "v";
          tr.appendChild(tdPos);
        }
        tr.appendChild(buildLangCell(vg, lang, cssClass));
      });
      i = j;
    } else {
      const tr = tbody.insertRow();
      const tdPos = document.createElement("td");
      tdPos.className = `cell-pos ${cssClass}`;
      tdPos.textContent = POS_ABBREV[pg.pos] || pg.pos;
      tr.appendChild(tdPos);
      tr.appendChild(buildLangCell(pg, lang, cssClass));
      i++;
    }
  }
  return table;
}

// ============================================================
// Render full result
// ============================================================

function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function mdToHtml(s) {
  // Escape HTML first, then convert _text_ to <em>text</em>
  return escHtml(s).replace(/_((?:(?!_).)+)_/g, "<em>$1</em>");
}

function buildExampleItem(ex, data, prefCodes) {
  const item = document.createElement("div");
  item.className = "example-item";
  const isGlobasaMode = selectedLangs.includes("Globasa");
  const glbDiv = document.createElement("div");
  glbDiv.className = "example-glb";
  const glossary = isGlobasaMode ? {} : (data.word_glossary || {});
  glbDiv.innerHTML = buildGlobExample(ex.glb_seg, data.word, glossary);
  item.appendChild(glbDiv);
  const trans = ex.translations || {};
  const aligns = ex.alignments || {};
  const targetWord = data.word.toLowerCase();
  for (const code of prefCodes) {
    if (trans[code]) {
      const transDiv = document.createElement("div");
      transDiv.className = "example-trans";
      const displayLang = TMX_TO_LANG[code] || code;
      if (prefCodes.length > 1) {
        const langTag = document.createElement("span");
        langTag.className = "example-lang-tag";
        langTag.textContent = langName(displayLang) + ": ";
        transDiv.appendChild(langTag);
      }
      const langAlign = aligns[code] || {};
      if (isGlobasaMode) {
        const reverseAlign = {};
        for (const [glbWord, positions] of Object.entries(langAlign)) {
          for (const pos of positions) {
            if (!reverseAlign[pos]) reverseAlign[pos] = [];
            reverseAlign[pos].push(glbWord);
          }
        }
        transDiv.innerHTML += buildTransWithGlobasaTooltips(trans[code], reverseAlign, targetWord);
      } else {
        const alignedPositions = new Set(langAlign[targetWord] || []);
        if (alignedPositions.size > 0) {
          transDiv.innerHTML += buildAlignedTranslation(trans[code], alignedPositions);
        } else {
          transDiv.appendChild(document.createTextNode(trans[code]));
        }
      }
      item.appendChild(transDiv);
    }
  }
  if (ex.context) {
    const srcDiv = document.createElement("div");
    srcDiv.className = "example-source";
    srcDiv.textContent = "\u2014 " + ex.context;
    item.appendChild(srcDiv);
  }
  return item;
}

function renderResult(data) {
  document.getElementById("landing").classList.add("hidden");
  document.getElementById("result").style.display = "block";

  // --- 1. Heading ---
  const headDiv = document.getElementById("wordHeading");
  headDiv.innerHTML = "";

  const titleSpan = document.createElement("span");
  titleSpan.className = "word-title";
  let gClass = "";
  if (data.globasa_gender === "te") gClass = "gender-te";
  else if (data.globasa_gender === "to") gClass = "gender-to";
  else if (data.globasa_gender === "mante") gClass = "gender-mante";
  else if (data.globasa_gender === "femte") gClass = "gender-femte";
  titleSpan.innerHTML = gClass
    ? `<span class="${gClass}">${escHtml(convertScript(data.word))}</span>`
    : escHtml(convertScript(data.word));
  headDiv.appendChild(titleSpan);

  if (data.wordclass) {
    const wcSpan = document.createElement("span");
    wcSpan.className = "word-class";
    wcSpan.textContent = `[${data.wordclass}]`;
    headDiv.appendChild(wcSpan);
  }

  // Anaphor labels
  if (data.globasa_gender) {
    const ANAPHOR_INFO = {
      "te":    {label: "te", title: "3rd person animate (he/she/it [living])"},
      "to":    {label: "to", title: "3rd person inanimate (it)"},
      "mante": {label: "mante", title: "masculine (he)"},
      "femte": {label: "femte", title: "feminine (she)"},
    };
    // Parse: "te", "to", "te, to", "to, te", "mante", "femte"
    const parts = data.globasa_gender.split(/[,.]/).map(s => s.trim()).filter(s => s);
    parts.forEach(p => {
      const info = ANAPHOR_INFO[p];
      if (info) {
        const lbl = document.createElement("span");
        lbl.className = `anaphor-label anaphor-${p}`;
        lbl.textContent = info.label;
        lbl.title = info.title;
        headDiv.appendChild(lbl);
      }
    });
  }

  if (data.has_pronunciation) {
    // Hector's recordings, except a synthesized lesson's (17): say which, and
    // never let a synthesized voice pass as his.
    const synth = data.pronunciation_voice === "synthesized";
    const btn = document.createElement("button");
    btn.className = "btn-audio";
    btn.title = synth ? "Play pronunciation: a synthesized voice (lesson 17), not Hector"
                      : "Play Hector's pronunciation";
    btn.textContent = synth ? "🔊 synthesized" : "🔊";
    btn.addEventListener("click", () => {
      const au = document.getElementById("pronAudio");
      au.src = `/audio/${encodeURIComponent(data.pronunciation_file || data.word)}.ogg`;
      au.play();
    });
    headDiv.appendChild(btn);
  }

  // --- 2. Images with no part of speech to sit on ---
  // Illustrated PoS rows carry their pictures inside the translation table, so
  // each gloss is printed once. Only images whose `pos` is unassigned land here.
  const imgSection = document.getElementById("imageSection");
  imgSection.innerHTML = "";
  const loose = (data.image_senses || []).filter(sn => (sn.images || []).length > 0);
  if (loose.length > 0) {
    const wrap = document.createElement("div");
    wrap.className = "word-image-wrap";
    wrap.appendChild(buildImageTile(loose, data.word));
    if (data.nsfw) {
      const det = document.createElement("details");
      det.className = "nsfw-wrap";
      const sum = document.createElement("summary");
      sum.textContent = "⚠ NSFW image — click to reveal";
      det.appendChild(sum);
      det.appendChild(wrap);
      imgSection.appendChild(det);
    } else {
      imgSection.appendChild(wrap);
    }
  }

  // --- 3. Translation table ---
  const transSection = document.getElementById("transSection");
  transSection.innerHTML = "";
  if (data.translations && data.translations.pos_groups && data.translations.pos_groups.length > 0) {
    transSection.appendChild(buildTransTable(data));
  }

  // --- 4. Constructions ---
  const consSection = document.getElementById("constructionsSection");
  consSection.innerHTML = "";
  const cons = data.constructions || [];
  const filteredCons = cons.filter(c => c.construction);
  if (filteredCons.length > 0) {
    consSection.appendChild(document.createElement("hr")).className = "section-rule";
    const wrap = document.createElement("div");
    wrap.className = "constructions-section";
    const h = document.createElement("div");
    h.className = "section-heading";
    h.textContent = uiLabel("constructions");
    wrap.appendChild(h);
    filteredCons.forEach(c => {
      const item = document.createElement("div");
      item.className = "construction-item";

      // Determine slot type from construction: contains 'na' → verb slot, else noun slot
      const conText = c.construction;
      const hasVerbSlot = /\bna\b/.test(conText);
      const slotLabel = hasVerbSlot ? "ᵛ" : "ⁿ";
      // Append the slot indicator with the white rectangle ▯
      const formSpan = document.createElement("span");
      formSpan.className = "construction-form";
      formSpan.innerHTML = escHtml(convertScriptSentence(conText)) + ` ▯<span class="slot-label">${slotLabel}</span>`;

      const transSpan = document.createElement("span");
      transSpan.className = "construction-trans";
      transSpan.textContent = c.translation || "";

      item.appendChild(formSpan);
      item.appendChild(transSpan);
      wrap.appendChild(item);
    });
    consSection.appendChild(wrap);
  }

  // --- 5. Metadata ---
  const metaSection = document.getElementById("metaSection");
  metaSection.innerHTML = "";
  const hasMeta = (data.synonyms && data.synonyms.length > 0) ||
                  (data.antonyms && data.antonyms.length > 0) ||
                  (data.tags && data.tags.length > 0) ||
                  data.category;
  if (hasMeta) {
    metaSection.appendChild(document.createElement("hr")).className = "section-rule";
    const wrap = document.createElement("div");
    wrap.className = "meta-section";

    if (data.synonyms && data.synonyms.length > 0) {
      wrap.appendChild(makeMetaRow(uiLabel("synonyms"),
        data.synonyms.map(w => `<a href="#" class="word-link" data-word="${escHtml(w)}">${escHtml(convertScript(w))}</a>`).join(", ")));
    }
    if (data.antonyms && data.antonyms.length > 0) {
      wrap.appendChild(makeMetaRow(uiLabel("antonyms"),
        data.antonyms.map(w => `<a href="#" class="word-link" data-word="${escHtml(w)}">${escHtml(convertScript(w))}</a>`).join(", ")));
    }
    if (data.tags && data.tags.length > 0) {
      const tagHtml = data.tags.map(t =>
        `<a href="#" class="chip tag-link" data-tag="${escHtml(t)}">${escHtml(t)}</a>`
      ).join(" ");
      wrap.appendChild(makeMetaRow(uiLabel("tags"), tagHtml));
    }
    if (data.category) {
      const catKey = "cat." + data.category.replace(/ /g, "_");
      const catLabel = uiLabel(catKey) || data.category;
      wrap.appendChild(makeMetaRow(uiLabel("category"), escHtml(catLabel)));
    }
    metaSection.appendChild(wrap);

    // Attach click handlers to word links
    metaSection.querySelectorAll(".word-link").forEach(a => {
      a.addEventListener("click", e => {
        e.preventDefault();
        const w = a.textContent.trim();
        glbInput.value = w; transInput.value = "";
        doLookup(w);
      });
    });
    // Attach click handlers to tag links
    metaSection.querySelectorAll(".tag-link").forEach(a => {
      a.addEventListener("click", e => {
        e.preventDefault();
        browseTag(a.dataset.tag);
      });
    });
  }

  // --- 6. Etymology ---
  const etymSection = document.getElementById("etymologySection");
  etymSection.innerHTML = "";
  if (data.etymology) {
    const wrap = document.createElement("div");
    wrap.className = "etymology-section";
    const h = document.createElement("div");
    h.className = "section-heading";
    h.textContent = uiLabel("etymology");
    // Detect compound etymology: "word1 + word2 + ..." (no language names/parens)
    const isCompound = /^-?[a-zA-ZğüşıöçĞÜŞİÖÇ]+(\s*\+\s*-?[a-zA-ZğüşıöçĞÜŞİÖÇ]+)+$/.test(data.etymology.trim());

    wrap.appendChild(h);

    if (isCompound) {
      const compDiv = document.createElement("div");
      compDiv.className = "etymology-compound";
      data.etymology.split("+").forEach((part, i) => {
        if (i > 0) {
          const plus = document.createElement("span");
          plus.className = "etym-plus";
          plus.textContent = " + ";
          compDiv.appendChild(plus);
        }
        const w = part.trim();
        const a = document.createElement("a");
        a.href = "#";
        a.className = "word-link";
        a.textContent = convertScript(w);
        a.addEventListener("click", e => {
          e.preventDefault();
          glbInput.value = w.replace(/^-/, ""); transInput.value = "";
          doLookup(w.replace(/^-/, ""));
        });
        compDiv.appendChild(a);
      });
      wrap.appendChild(compDiv);
    } else {
      // Multi-language etymology: split on ", " outside parentheses
      // Format: "Arabisa (إنسان "iinsan"), Turkisa (insan)"
      const parts = [];
      let depth = 0, cur = "";
      for (const ch of data.etymology) {
        if (ch === "(") depth++;
        if (ch === ")") depth--;
        if (ch === "," && depth === 0) {
          parts.push(cur.trim());
          cur = "";
        } else {
          cur += ch;
        }
      }
      if (cur.trim()) parts.push(cur.trim());

      const tbl = document.createElement("table");
      tbl.className = "etymology-table";
      parts.forEach(part => {
        const m = part.match(/^(\S+)\s*(.*)/);
        if (!m) return;
        const tr = document.createElement("tr");
        const tdLang = document.createElement("td");
        tdLang.className = "etym-lang";
        tdLang.textContent = etymLangName(m[1]);
        const tdVal = document.createElement("td");
        tdVal.className = "etym-val";
        tdVal.textContent = (m[2] || "").replace(/^\(/, "").replace(/\)$/, "").trim();
        tr.appendChild(tdLang);
        tr.appendChild(tdVal);
        tbl.appendChild(tr);
      });
      wrap.appendChild(tbl);
    }
    etymSection.appendChild(wrap);
  }

  // --- 7. Derived words ---
  const derivedSection = document.getElementById("derivedSection");
  derivedSection.innerHTML = "";
  if (data.derived_words && data.derived_words.length > 0) {
    derivedSection.appendChild(document.createElement("hr")).className = "section-rule";
    const wrap = document.createElement("div");
    wrap.className = "derived-section";
    const headerRow = document.createElement("div");
    headerRow.style.display = "flex";
    headerRow.style.alignItems = "center";
    headerRow.style.gap = "0.3rem";
    headerRow.style.flexWrap = "wrap";
    const h = document.createElement("span");
    h.className = "section-heading";
    h.style.marginBottom = "0";
    h.textContent = uiLabel("derived_words") + ":";
    headerRow.appendChild(h);
    const toggleBtn = makeToggleBtn();
    headerRow.appendChild(toggleBtn);
    // Inline word links (always visible)
    data.derived_words.forEach(w => {
      const a = document.createElement("a");
      a.href = "#";
      a.className = "derived-link-inline";
      a.textContent = convertScript(w);
      a.addEventListener("click", e => {
        e.preventDefault();
        glbInput.value = w; transInput.value = "";
        doLookup(w);
      });
      headerRow.appendChild(a);
    });
    wrap.appendChild(headerRow);
    // Expandable translation tables for each derived word
    const detailsBody = document.createElement("div");
    detailsBody.className = "collapsible-body derived-details";
    let detailsLoaded = false;
    toggleBtn.addEventListener("click", () => {
      toggleCollapsible(toggleBtn, detailsBody);
      if (!detailsLoaded) {
        detailsLoaded = true;
        loadDerivedDetails(data.derived_words, detailsBody);
      }
    });
    wrap.appendChild(detailsBody);
    derivedSection.appendChild(wrap);
  }

  // --- 8. Examples ---
  const exSection = document.getElementById("examplesSection");
  exSection.innerHTML = "";
  const examples = data.examples || [];
  if (examples.length > 0) {
    exSection.appendChild(document.createElement("hr")).className = "section-rule";
    const wrap = document.createElement("div");
    wrap.className = "examples-section";
    const headerRow = document.createElement("div");
    headerRow.style.display = "flex";
    headerRow.style.alignItems = "center";
    headerRow.style.gap = "0.3rem";
    const h = document.createElement("span");
    h.className = "section-heading";
    h.style.marginBottom = "0";
    h.textContent = uiLabel("example_sentences") + ":";
    headerRow.appendChild(h);
    const exToggle = makeToggleBtn();
    headerRow.appendChild(exToggle);
    wrap.appendChild(headerRow);
    const exBody = document.createElement("div");
    exBody.className = "collapsible-body";

    // Map selected viewer languages to TMX codes
    const prefCodes = selectedLangs
      .map(l => LANG_TO_TMX[l])
      .filter(c => c);

    // Sort: favor examples with translations in selected display languages.
    // Score = count of selected languages that have a translation for this example.
    // Higher score (both languages) ranks above lower (one language) ranks above zero.
    const transScore = ex => prefCodes.reduce((n, c) => n + ((ex.translations || {})[c] ? 1 : 0), 0);
    const sorted = [...examples].sort((a, b) => transScore(b) - transScore(a));

    const MAX_EXAMPLES = 5;
    const sliced = sorted.slice(0, MAX_EXAMPLES);
    sliced.forEach((ex, exIdx) => {
      const item = buildExampleItem(ex, data, prefCodes);
      // First example always visible; rest go in collapsible body
      if (exIdx === 0) {
        wrap.appendChild(item);
      } else {
        exBody.appendChild(item);
      }
    });
    if (sliced.length > 1) {
      wrap.appendChild(exBody);
      exToggle.addEventListener("click", () => toggleCollapsible(exToggle, exBody));
    } else {
      exToggle.style.display = "none";
    }
    exSection.appendChild(wrap);
  }

  // --- 9. Sound effect ---
  const soundSection = document.getElementById("soundSection");
  soundSection.innerHTML = "";
  if (data.sound_effect && data.sound_effect.audio_url) {
    const wrap = document.createElement("div");
    wrap.className = "sound-section";
    const h = document.createElement("div");
    h.className = "section-heading";
    h.textContent = uiLabel("sound_effect");
    const aud = document.createElement("audio");
    aud.controls = true;
    aud.src = data.sound_effect.audio_url;
    aud.preload = "none";
    const attr = document.createElement("div");
    attr.className = "sound-attr";
    if (data.sound_effect.source_url) {
      attr.innerHTML = `Source: <a href="${escHtml(data.sound_effect.source_url)}" target="_blank" rel="noopener">${escHtml(data.sound_effect.source_url)}</a>`;
    }
    wrap.appendChild(h);
    wrap.appendChild(aud);
    wrap.appendChild(attr);
    soundSection.appendChild(wrap);
  }

  // --- 10. Menalari link ---
  const mLink = document.getElementById("menalariLink");
  mLink.innerHTML = "";
  mLink.appendChild(document.createElement("hr")).className = "section-rule";
  const mLinkA = document.createElement("a");
  mLinkA.href = `https://menalari.globasa.net/eng/lexi/${encodeURIComponent(data.word)}`;
  mLinkA.target = "_blank";
  mLinkA.rel = "noopener";
  mLinkA.textContent = "\uD83D\uDD17 word link";
  mLink.appendChild(mLinkA);
}

function makeMetaRow(label, html) {
  const row = document.createElement("div");
  row.className = "meta-row";
  const lbl = document.createElement("span");
  lbl.className = "meta-label";
  lbl.textContent = label + ":";
  const val = document.createElement("span");
  val.className = "meta-value";
  val.innerHTML = html;
  row.appendChild(lbl);
  row.appendChild(val);
  return row;
}

function buildAlignedTranslation(text, alignedPositions) {
  // Tokenize matching GIZA's tokenization (punctuation split from words)
  const tokens = text.replace(/([.,:;!?"""()'\u2014\-])/g, ' $1 ').split(/\s+/).filter(t => t);
  let html = "";
  tokens.forEach((tok, idx) => {
    if (idx > 0) html += " ";
    if (alignedPositions.has(idx)) {
      html += `<strong>${mdToHtml(tok)}</strong>`;
    } else {
      html += mdToHtml(tok);
    }
  });
  return html;
}

function buildTransWithGlobasaTooltips(text, reverseAlign, targetWord) {
  // In Globasa mode: each translation token gets a tooltip showing the aligned Globasa word(s)
  // targetWord's aligned tokens are bolded
  const tokens = text.replace(/([.,:;!?"""()'\u2014\-])/g, ' $1 ').split(/\s+/).filter(t => t);
  let html = "";
  tokens.forEach((tok, idx) => {
    if (idx > 0) html += " ";
    const glbWords = reverseAlign[idx];
    const isTarget = glbWords && glbWords.some(w => w === targetWord);
    const inner = isTarget ? `<strong>${escHtml(tok)}</strong>` : escHtml(tok);
    if (glbWords && glbWords.length > 0) {
      const tooltip = glbWords.join(", ");
      html += `<span title="${escHtml(tooltip)}">${inner}</span>`;
    } else {
      html += inner;
    }
  });
  return html;
}

function pickGloss(glossEntry) {
  // glossEntry is {lang: gloss} — pick best match for selected languages
  if (!glossEntry) return "";
  let raw = "";
  for (const lang of selectedLangs) {
    if (glossEntry[lang]) { raw = glossEntry[lang]; break; }
  }
  if (!raw) raw = glossEntry["English"] || Object.values(glossEntry)[0] || "";
  // Strip _markdown_ for plain-text tooltip contexts
  return raw.replace(/_([^_]+)_/g, "$1");
}

function buildGlobExample(seg, targetWord, glossary) {
  // Split into word tokens and whitespace/punctuation, preserving originals
  const target = targetWord.toLowerCase();
  const MAX_NGRAM = 5;

  // Split into alternating [word, separator, word, separator, ...] tokens
  // where "word" tokens are alphabetic and separators are whitespace/punctuation
  const parts = seg.split(/(\s+)/);
  // Extract just the word tokens with their indices into parts[]
  const words = []; // [{idx, raw, clean}]
  parts.forEach((p, i) => {
    if (!/\s+/.test(p) && p.length > 0) {
      const clean = p.toLowerCase().replace(/[^a-zğüşıöç]/g, "");
      if (clean) words.push({idx: i, raw: p, clean});
    }
  });

  // Greedy longest-match: mark which word indices are consumed by a phrase
  // consumed[wordIdx] = {tooltip, phraseLen} or null
  const consumed = new Array(words.length).fill(null);
  for (let i = 0; i < words.length; i++) {
    if (consumed[i]) continue;
    // Try longest n-gram first
    for (let n = Math.min(MAX_NGRAM, words.length - i); n >= 1; n--) {
      const phrase = words.slice(i, i + n).map(w => w.clean).join(" ");
      const glossEntry = glossary[phrase];
      if (glossEntry) {
        const tooltip = pickGloss(glossEntry);
        if (tooltip) {
          for (let k = i; k < i + n; k++) {
            consumed[k] = {tooltip, start: i, len: n};
          }
          break;
        }
      }
    }
  }

  // Build result: iterate over parts[], using consumed[] for word tokens
  let result = "";
  let wordIdx = 0;
  parts.forEach((p, i) => {
    if (/\s+/.test(p)) {
      result += p;
      return;
    }
    const clean = p.toLowerCase().replace(/[^a-zğüşıöç]/g, "");
    if (!clean) {
      result += escHtml(p);
      return;
    }

    const info = consumed[wordIdx];
    const isTarget = clean === target;

    const display = escHtml(convertScript(p));
    if (info) {
      // Part of a matched phrase — open span on first word, close on last
      const isFirst = (wordIdx === info.start);
      const isLast = (wordIdx === info.start + info.len - 1);
      if (isFirst) result += `<span title="${escHtml(info.tooltip)}">`;
      result += isTarget ? `<strong>${display}</strong>` : display;
      if (isLast) result += `</span>`;
    } else if (isTarget) {
      result += `<strong>${display}</strong>`;
    } else {
      result += display;
    }
    wordIdx++;
  });
  return result;
}

function loadDerivedDetails(words, container) {
  const loading = document.createElement("div");
  loading.className = "derived-loading";
  loading.textContent = "Loading translations\u2026";
  container.appendChild(loading);

  // Fetch all derived words in parallel
  const tableLangs = selectedLangs.filter(l => l !== "Globasa");
  const langs = tableLangs.length > 0 ? tableLangs : ["English"];
  const firstLang = selectedLangs.length > 0 ? selectedLangs[0] : langs[0];

  Promise.all(words.map(w =>
    fetch(`/lookup/${encodeURIComponent(w)}`).then(r => r.ok ? r.json() : null).catch(() => null)
  )).then(results => {
    loading.remove();
    results.forEach((dData, i) => {
      if (!dData || !dData.translations || !dData.translations.pos_groups.length) return;
      const entry = document.createElement("div");
      entry.className = "derived-entry";
      const wordEl = document.createElement("div");
      wordEl.className = "derived-entry-word";
      wordEl.textContent = convertScript(words[i]);
      wordEl.addEventListener("click", () => {
        glbInput.value = words[i]; transInput.value = "";
        doLookup(words[i]);
      });
      entry.appendChild(wordEl);
      entry.appendChild(buildMiniTransTable(dData));
      container.appendChild(entry);
    });
  });
}

function makeToggleBtn() {
  const btn = document.createElement("button");
  btn.className = "toggle-btn";
  btn.textContent = "[+]";
  btn.title = "Show/hide";
  return btn;
}

function toggleCollapsible(btn, body) {
  const isOpen = body.classList.toggle("open");
  btn.textContent = isOpen ? "[\u2212]" : "[+]";
}

// ============================================================
// Lookup
// ============================================================

let debounceTimer = null;
let suggestTimer = null;
let activeSugIdx = -1;
let activeInput = null; // tracks which input triggered suggestions

const sugBox = document.getElementById("suggestions");
const glbInput = document.getElementById("searchGlb");
const transInput = document.getElementById("searchTrans");

function hideSuggestions() {
  sugBox.classList.remove("show");
  sugBox.innerHTML = "";
  activeSugIdx = -1;
}

function selectSuggestion(word) {
  glbInput.value = word;
  transInput.value = "";
  hideSuggestions();
  doLookup(word);
}

function showSuggestions(items) {
  sugBox.innerHTML = "";
  if (items.length === 0) {
    hideSuggestions();
    return;
  }
  activeSugIdx = -1;
  items.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "suggestion-item";
    const wordSpan = document.createElement("span");
    wordSpan.className = "sug-word";
    wordSpan.textContent = item.word;
    div.appendChild(wordSpan);
    if (item.type === "translation" && item.via) {
      const viaSpan = document.createElement("span");
      viaSpan.className = "sug-via";
      viaSpan.textContent = `\u2190 ${item.via}`;
      div.appendChild(viaSpan);
    }
    div.addEventListener("mousedown", e => {
      e.preventDefault();
      selectSuggestion(item.word);
    });
    sugBox.appendChild(div);
  });
  sugBox.classList.add("show");
}

function updateActiveSuggestion() {
  const items = sugBox.querySelectorAll(".suggestion-item");
  items.forEach((el, i) => {
    el.classList.toggle("active", i === activeSugIdx);
  });
}

function fetchSuggestions(q, mode) {
  if (q.length < 2) { hideSuggestions(); return; }
  const langs = selectedLangs.length > 0 ? selectedLangs.join(",") : "English";
  const modeParam = mode === "trans" ? "&mode=trans" : "";
  fetch(`/suggest?q=${encodeURIComponent(q)}&langs=${encodeURIComponent(langs)}${modeParam}`)
    .then(r => r.json())
    .then(items => {
      if (items.length === 1 && items[0].type === "exact") {
        hideSuggestions();
        return;
      }
      showSuggestions(items);
    })
    .catch(() => hideSuggestions());
}

function doLookup(word) {
  word = word.trim();
  hideSuggestions();
  document.getElementById("tagBrowser").style.display = "none";
  if (!word) {
    document.getElementById("status").textContent = "";
    document.getElementById("result").style.display = "none";
    document.getElementById("landing").classList.remove("hidden");
    return;
  }
  document.getElementById("landing").classList.add("hidden");
  document.getElementById("status").textContent = `Looking up \u201c${word}\u201d\u2026`;

  fetch(`/lookup/${encodeURIComponent(word)}`)
    .then(r => {
      if (!r.ok) throw new Error(r.status === 404 ? `\u201c${word}\u201d not found.` : `Error ${r.status}`);
      return r.json();
    })
    .then(data => {
      currentData = data;
      document.getElementById("status").textContent = "";
      renderResult(data);
    })
    .catch(err => {
      document.getElementById("status").textContent = err.message || "Lookup failed.";
      document.getElementById("result").style.display = "none";
      document.getElementById("landing").classList.add("hidden");
      fetchSuggestions(word, "glb");
    });
}

function browseTag(tag) {
  // Hide word result and landing, show tag browser
  document.getElementById("result").style.display = "none";
  document.getElementById("landing").classList.add("hidden");
  document.getElementById("status").textContent = "";
  const browser = document.getElementById("tagBrowser");
  const heading = document.getElementById("tagBrowserHeading");
  const wordsDiv = document.getElementById("tagBrowserWords");
  browser.style.display = "block";
  heading.textContent = tag;
  wordsDiv.innerHTML = "<em style='color:var(--color-muted)'>Loading\u2026</em>";

  fetch(`/tags/${encodeURIComponent(tag)}`)
    .then(r => r.ok ? r.json() : Promise.reject("Tag not found"))
    .then(data => {
      wordsDiv.innerHTML = "";
      // Fetch all words in parallel and render mini tables
      Promise.all(data.words.map(w =>
        fetch(`/lookup/${encodeURIComponent(w)}`).then(r => r.ok ? r.json() : null).catch(() => null)
      )).then(results => {
        results.forEach((wData, i) => {
          const entry = document.createElement("div");
          entry.className = "derived-entry";
          const wordEl = document.createElement("div");
          wordEl.className = "derived-entry-word";
          wordEl.textContent = convertScript(data.words[i]);
          wordEl.addEventListener("click", () => {
            glbInput.value = data.words[i]; transInput.value = "";
            doLookup(data.words[i]);
          });
          entry.appendChild(wordEl);
          if (wData && wData.translations && wData.translations.pos_groups.length) {
            entry.appendChild(buildMiniTransTable(wData));
          }
          wordsDiv.appendChild(entry);
        });
      });
    })
    .catch(() => {
      wordsDiv.innerHTML = "<em style='color:var(--color-muted)'>Failed to load tag.</em>";
    });
}

// Search button: prefer Globasa input, fall back to translation input
document.getElementById("searchBtn").addEventListener("click", () => {
  clearTimeout(debounceTimer);
  clearTimeout(suggestTimer);
  const glbVal = glbInput.value.trim();
  const transVal = transInput.value.trim();
  if (glbVal) {
    doLookup(glbVal);
  } else if (transVal) {
    fetchSuggestions(transVal, "trans");
  }
});

// Globasa input: direct lookup
function attachInputEvents(input, mode) {
  input.addEventListener("input", e => {
    clearTimeout(debounceTimer);
    clearTimeout(suggestTimer);
    activeInput = input;
    const val = e.target.value.trim();
    if (mode === "glb") {
      // Clear the other input
      transInput.value = "";
      suggestTimer = setTimeout(() => fetchSuggestions(val, "glb"), 180);
      debounceTimer = setTimeout(() => doLookup(val), 500);
    } else {
      // Translation: show suggestions only, don't auto-lookup
      glbInput.value = "";
      suggestTimer = setTimeout(() => fetchSuggestions(val, "trans"), 180);
    }
  });

  input.addEventListener("keydown", e => {
    const items = sugBox.querySelectorAll(".suggestion-item");
    if (e.key === "ArrowDown") {
      e.preventDefault();
      activeSugIdx = Math.min(activeSugIdx + 1, items.length - 1);
      updateActiveSuggestion();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeSugIdx = Math.max(activeSugIdx - 1, -1);
      updateActiveSuggestion();
    } else if (e.key === "Enter") {
      clearTimeout(debounceTimer);
      clearTimeout(suggestTimer);
      if (activeSugIdx >= 0 && activeSugIdx < items.length) {
        e.preventDefault();
        const word = items[activeSugIdx].querySelector(".sug-word").textContent;
        selectSuggestion(word);
      } else if (mode === "glb") {
        doLookup(e.target.value);
      } else {
        fetchSuggestions(e.target.value.trim(), "trans");
      }
    } else if (e.key === "Escape") {
      hideSuggestions();
    }
  });

  input.addEventListener("blur", () => {
    setTimeout(hideSuggestions, 150);
  });
}

attachInputEvents(glbInput, "glb");
attachInputEvents(transInput, "trans");

  const initWord = params.get("word");
  if (initWord) {
    glbInput.value = initWord;
    doLookup(initWord);
  }
});
