<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globasa Alignment Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Reset & Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-sans: 'Open Sans', system-ui, sans-serif;
  --body-size: 18px;
  --lh: 1.45;
  --color-text: #333;
  --color-muted: #666;
  --color-bg: #fafafa;
  --color-surface: #fff;
  --color-border: #e0e0e0;
  --color-link: #1a5fb4;
  --radius: 6px;
  --max-width: 90ch;
  --color-header-bg: #d5edcf;
  --color-header-text: #2a5a1e;
  --color-footer-bg: #1a3a6b;
  --color-footer-text: #fff;
  --color-search-btn: #4a8c3f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-text: #e8e8e8;
    --color-muted: #aaa;
    --color-bg: #1a1a1a;
    --color-surface: #252525;
    --color-border: #444;
    --color-link: #7cb4f8;
    --color-header-bg: #1e3318;
    --color-header-text: #b0d8a8;
    --color-footer-bg: #0e1f3d;
    --color-footer-text: #ccc;
    --color-search-btn: #3a6c30;
  }
}

html { font-size: var(--body-size); }
body {
  font-family: var(--font-sans);
  line-height: var(--lh);
  color: var(--color-text);
  background: var(--color-bg);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
a { color: var(--color-link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ============================================================
   Header (matches word_viewer.html)
   ============================================================ */
.site-header {
  background: var(--color-header-bg);
  color: var(--color-header-text);
  padding: 0.5rem 1rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.site-brand {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-weight: 700;
  font-size: 1.1rem;
  white-space: nowrap;
}
.site-nav {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.15rem;
  font-size: 0.82rem;
}
.site-nav a { color: var(--color-header-text); }
.nav-sep { color: var(--color-header-text); opacity: 0.5; user-select: none; }

/* ============================================================
   Footer
   ============================================================ */
.site-footer {
  background: var(--color-footer-bg);
  text-align: center;
  padding: 0.6rem 1rem;
  color: var(--color-footer-text);
}
.site-footer .footer-inner {
  max-width: var(--max-width);
  margin: 0 auto;
}

/* ============================================================
   Main content
   ============================================================ */
main {
  flex: 1;
  max-width: var(--max-width);
  width: 100%;
  margin: 0 auto;
  padding: 1rem;
}

/* ============================================================
   Controls bar
   ============================================================ */
.controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
  padding: 0.6rem 0.8rem;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}
.controls label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--color-muted);
}
.controls select,
.controls input[type="text"] {
  font-family: var(--font-sans);
  font-size: 0.9rem;
  padding: 0.3rem 0.5rem;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
  color: var(--color-text);
}
.controls select { min-width: 10rem; }
.controls input[type="text"] { min-width: 12rem; }

.source-group {
  display: flex;
  gap: 0;
}
.source-btn {
  font-family: var(--font-sans);
  font-size: 0.82rem;
  padding: 0.3rem 0.65rem;
  border: 1px solid var(--color-border);
  background: var(--color-bg);
  color: var(--color-text);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.source-btn:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.source-btn:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }
.source-btn + .source-btn { border-left: none; }
.source-btn.active {
  background: var(--color-search-btn);
  color: #fff;
  border-color: var(--color-search-btn);
}
.source-btn.active + .source-btn { border-left: 1px solid var(--color-search-btn); }

.pagination {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-left: auto;
}
.pagination button {
  font-family: var(--font-sans);
  font-size: 0.85rem;
  padding: 0.3rem 0.6rem;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  color: var(--color-text);
  cursor: pointer;
}
.pagination button:disabled {
  opacity: 0.4;
  cursor: default;
}
.page-info {
  font-size: 0.82rem;
  color: var(--color-muted);
  white-space: nowrap;
}

/* ============================================================
   Alignment entries
   ============================================================ */
#entries {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.entry-card {
  display: grid;
  grid-template-columns: 2.5rem 1fr;
  gap: 0 0.6rem;
  padding: 0.6rem 0.8rem;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}
.entry-idx {
  grid-row: 1 / span 3;
  color: var(--color-muted);
  font-size: 0.8rem;
  padding-top: 0.15rem;
  text-align: right;
  user-select: none;
}
.entry-ctx {
  font-style: italic;
  font-size: 0.75rem;
}
.entry-actions {
  margin-left: 0.4rem;
  display: inline-flex;
  gap: 0.3rem;
}
.entry-actions a, .entry-actions button {
  font-family: var(--font-sans);
  font-size: 0.72rem;
  padding: 0.05rem 0.4rem;
  border: 1px solid var(--color-border);
  border-radius: 3px;
  background: var(--color-bg);
  color: var(--color-link);
  cursor: pointer;
  text-decoration: none;
}
.entry-actions a:hover, .entry-actions button:hover {
  background: var(--color-search-btn);
  color: #fff;
  border-color: var(--color-search-btn);
}
.tok.pinned {
  outline: 2px solid var(--color-link);
  outline-offset: 1px;
}
.links-pane {
  font-size: 0.78rem;
  color: var(--color-muted);
  padding: 0.2rem 0 0 0;
  grid-column: 2 / 3;
  min-height: 1.2rem;
  font-family: var(--font-sans);
}
.links-pane .from-tok {
  font-weight: 700;
  color: var(--color-text);
}
.links-pane .arrow {
  margin: 0 0.3rem;
  opacity: 0.6;
}
.links-pane .to-tok {
  display: inline-block;
  padding: 0.02rem 0.3rem;
  margin-right: 0.25rem;
  border-radius: 3px;
  background: var(--color-bg);
  color: var(--color-text);
}
.links-pane .to-tok.null {
  font-style: italic;
  opacity: 0.6;
}
.entry-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.2rem 0.35rem;
  line-height: 1.65;
}
.row-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--color-muted);
  margin-right: 0.15rem;
  user-select: none;
}
.tok {
  display: inline-block;
  padding: 0.05rem 0.25rem;
  border-radius: 3px;
  cursor: default;
  transition: background 0.12s;
}
.entry-row.glb-row .tok { font-weight: 600; }

.status-msg {
  text-align: center;
  color: var(--color-muted);
  padding: 2rem;
  font-size: 0.95rem;
}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="30 0 100 75" width="28" height="28">
      <circle cx="78.75" cy="37.5" r="32.48" fill="#fff"/>
      <g fill="#008113"><path d="M62.5 9.37a18.78 18.78 0 0 1 32.5 0c-6.7 0-12.9 3.58-16.25 9.37a18.78 18.78 0 0 0-16.24-9.37"/><path d="M95 9.37a18.85 18.85 0 0 1 18.74 18.76c0 3.3-.86 6.52-2.5 9.37a18.79 18.79 0 0 0-16.25-9.37 18.78 18.78 0 0 0 0-18.76"/><path d="M111.23 37.5a18.77 18.77 0 0 1 2.51 9.37 18.85 18.85 0 0 1-18.75 18.76 18.78 18.78 0 0 0 0-18.76c6.7 0 12.9-3.58 16.24-9.37"/><path d="M95 65.63a18.78 18.78 0 0 1-32.5 0c6.7 0 12.9-3.57 16.25-9.37a18.78 18.78 0 0 0 16.24 9.37"/><path d="M62.5 65.63a18.85 18.85 0 0 1-18.74-18.76c0-3.3.86-6.52 2.5-9.37a18.79 18.79 0 0 0 16.25 9.37 18.78 18.78 0 0 0 0 18.76"/><path d="M46.27 37.5a18.77 18.77 0 0 1-2.51-9.37A18.85 18.85 0 0 1 62.51 9.37a18.78 18.78 0 0 0 0 18.76c-6.7 0-12.9 3.58-16.25 9.37"/></g>
      <g fill="#0040a9"><path d="M78.75 18.74c6.7 0 12.9 3.6 16.24 9.4-6.69 0-12.89 3.57-16.24 9.36a18.78 18.78 0 0 0 0-18.76"/><path d="M95 28.13a18.78 18.78 0 0 1 0 18.74 18.78 18.78 0 0 0-16.25-9.37c6.69 0 12.9-3.58 16.24-9.37"/><path d="M95 46.87a18.78 18.78 0 0 1-16.25 9.4 18.78 18.78 0 0 0 0-18.77 18.79 18.79 0 0 0 16.24 9.37"/><path d="M78.75 56.26c-6.7 0-12.9-3.6-16.24-9.4 6.69 0 12.89-3.57 16.24-9.36a18.78 18.78 0 0 0 0 18.76"/><path d="M62.5 46.87a18.78 18.78 0 0 1 0-18.74 18.78 18.78 0 0 0 16.25 9.37c-6.69 0-12.9 3.58-16.24 9.37"/><path d="M62.5 28.13c3.35-5.8 9.55-9.39 16.25-9.4a18.78 18.78 0 0 0 0 18.77 18.79 18.79 0 0 0-16.24-9.37"/></g>

    <span class="site-title">Globasa</span>

<main>
  <div class="controls">
    <label for="lang-select">Language</label>
    <select id="lang-select"></select>

    <label>Source</label>
    <div class="source-group">
      <button class="source-btn active" data-source="a3">A3</button>
      <button class="source-btn" data-source="fwd">Forward</button>
      <button class="source-btn" data-source="rev">Reverse</button>
      <button class="source-btn" data-source="gdfa">GDFA</button>
    </div>

    <label for="context-select">Corpus</label>
    <select id="context-select"><option value="">All</option></select>

    <label for="search-input">Filter</label>
    <input type="text" id="search-input" placeholder="Filter by word...">

    <div class="pagination">
      <button id="prev-btn" disabled>&larr; Prev</button>
      <span class="page-info" id="page-info">Page 1 of 1</span>
      <button id="next-btn" disabled>Next &rarr;</button>
    </div>
  </div>

  <div id="entries">
    <div class="status-msg" id="status-msg">Loading...</div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    Globasa Alignment Viewer
  </div>
</footer>

<script>
(function() {
  "use strict";

  /* ── Color palettes ─────────────────────────────────────── */
  const COLORS_LIGHT = ["#ffd9b3","#b2f2e8","#a9c4e8","#ffc078","#d4b5e8","#b8e0a0","#f5c6c6","#c8e6f0"];
  const COLORS_DARK  = ["#7a4a20","#1a5550","#1a3560","#7a5010","#4a2d5a","#2a4a20","#5a2020","#1a3a4a"];

  function getColors() {
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? COLORS_DARK : COLORS_LIGHT;
  }

  /* ── Language names ─────────────────────────────────────── */
  const LANG_NAMES = {
    en: "English", eo: "Esperanto", es: "Spanish", de: "German", fr: "French",
    ru: "Russian", nl: "Dutch", pt: "Portuguese", id: "Indonesian", da: "Danish",
    ar: "Arabic", hi: "Hindi", sw: "Swahili", tr: "Turkish", zh: "Chinese"
  };

  /* ── State ──────────────────────────────────────────────── */
  let currentLang = "";
  let currentSource = "a3";
  let currentContext = "";
  let currentPage = 1;
  let totalPages = 1;
  let searchQuery = "";
  let debounceTimer = null;

  /* ── DOM refs ───────────────────────────────────────────── */
  const langSelect    = document.getElementById("lang-select");
  const contextSelect = document.getElementById("context-select");
  const searchInput   = document.getElementById("search-input");
  const entriesDiv    = document.getElementById("entries");
  const statusMsg     = document.getElementById("status-msg");
  const prevBtn       = document.getElementById("prev-btn");
  const nextBtn       = document.getElementById("next-btn");
  const pageInfo      = document.getElementById("page-info");
  const sourceGroup   = document.querySelector(".source-group");

  /* ── Init: fetch available languages ────────────────────── */
  fetch("/api/alignment_langs")
    .then(r => r.json())
    .then(langs => {
      if (!langs.length) {
        statusMsg.textContent = "No alignment data available.";
        return;
      }
      langs.forEach(item => {
        const code = item.lang;
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = LANG_NAMES[code] || code;
        langSelect.appendChild(opt);
      });
      currentLang = langs[0].lang;
      langSelect.value = currentLang;
      loadContexts();
      loadAlignments();
    })
    .catch(() => {
      statusMsg.textContent = "Failed to load languages.";
    });

  /* ── Load corpus contexts for current lang/source ──────── */
  function loadContexts() {
    contextSelect.innerHTML = '<option value="">All</option>';
    if (currentSource !== "a3") return;
    fetch("/api/alignment_contexts?lang=" + encodeURIComponent(currentLang) + "&source=" + currentSource)
      .then(r => r.json())
      .then(contexts => {
        contexts.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.context;
          opt.textContent = c.context + " (" + c.count + ")";
          contextSelect.appendChild(opt);
        });
      })
      .catch(() => {});
  }

  /* ── Event listeners ────────────────────────────────────── */
  langSelect.addEventListener("change", () => {
    currentLang = langSelect.value;
    currentContext = "";
    currentPage = 1;
    loadContexts();
    loadAlignments();
  });

  contextSelect.addEventListener("change", () => {
    currentContext = contextSelect.value;
    currentPage = 1;
    loadAlignments();
  });

  sourceGroup.addEventListener("click", e => {
    const btn = e.target.closest(".source-btn");
    if (!btn) return;
    sourceGroup.querySelectorAll(".source-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentSource = btn.dataset.source;
    currentContext = "";
    currentPage = 1;
    loadContexts();
    loadAlignments();
  });

  searchInput.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      searchQuery = searchInput.value.trim();
      currentPage = 1;
      loadAlignments();
    }, 300);
  });

  prevBtn.addEventListener("click", () => {
    if (currentPage > 1) { currentPage--; loadAlignments(); }
  });
  nextBtn.addEventListener("click", () => {
    if (currentPage < totalPages) { currentPage++; loadAlignments(); }
  });

  /* ── Fetch & render ─────────────────────────────────────── */
  function loadAlignments() {
    if (!currentLang) return;
    const params = new URLSearchParams({
      lang: currentLang,
      source: currentSource,
      page: currentPage,
      per_page: 50
    });
    if (searchQuery) params.set("q", searchQuery);
    if (currentContext) params.set("context", currentContext);

    statusMsg.textContent = "Loading...";
    statusMsg.style.display = "";
    entriesDiv.querySelectorAll(".entry-card").forEach(c => c.remove());

    fetch("/api/alignments?" + params)
      .then(r => r.json())
      .then(renderData)
      .catch(() => {
        statusMsg.textContent = "Failed to load alignments.";
      });
  }

  function renderData(data) {
    const perPage = data.per_page || 50;
    totalPages = Math.max(1, Math.ceil(data.total / perPage));
    currentPage = data.page;

    pageInfo.textContent = "Page " + currentPage + " of " + totalPages;
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;

    if (!data.entries || !data.entries.length) {
      statusMsg.textContent = "No entries found.";
      statusMsg.style.display = "";
      return;
    }
    statusMsg.style.display = "none";

    const globalOffset = (currentPage - 1) * perPage;

    data.entries.forEach((entry, i) => {
      const entryIdx = globalOffset + i + 1;

      /* Build link maps: for each token, which indices on the other side? */
      const glbLinks = {};  /* glb_idx -> [tgt_idx, ...] */
      const tgtLinks = {};  /* tgt_idx -> [glb_idx, ...] */
      (entry.links || []).forEach(([g, t]) => {
        (glbLinks[g] = glbLinks[g] || []).push(t);
        (tgtLinks[t] = tgtLinks[t] || []).push(g);
      });

      const card = document.createElement("div");
      card.className = "entry-card";
      /* sentence_id for jumping to annotator: index in the underlying
         alignment list (page-aware). Use entryIdx-1 since entryIdx is 1-based. */
      const sid = entryIdx - 1;
      card.dataset.sid = sid;
      card.dataset.lang = data.lang;

      /* Index + context + Annotate button */
      const idxEl = document.createElement("div");
      idxEl.className = "entry-idx";
      idxEl.textContent = entryIdx;
      if (entry.context) {
        const ctxEl = document.createElement("span");
        ctxEl.className = "entry-ctx";
        ctxEl.textContent = " — " + entry.context;
        idxEl.appendChild(ctxEl);
      }
      const actionsEl = document.createElement("span");
      actionsEl.className = "entry-actions";
      const annotateLink = document.createElement("a");
      annotateLink.href = "/annotate?lang=" + encodeURIComponent(data.lang) + "&sid=" + sid;
      annotateLink.target = "_blank";
      annotateLink.title = "Annotate this sentence in a new tab";
      annotateLink.textContent = "✏ Annotate";
      actionsEl.appendChild(annotateLink);
      idxEl.appendChild(actionsEl);
      card.appendChild(idxEl);

      /* GLB row */
      const glbRow = document.createElement("div");
      glbRow.className = "entry-row glb-row";
      const glbLabel = document.createElement("span");
      glbLabel.className = "row-label";
      glbLabel.textContent = "GLB";
      glbRow.appendChild(glbLabel);
      entry.glb_tokens.forEach((tok, idx) => {
        const span = document.createElement("span");
        span.className = "tok";
        span.textContent = tok;
        span.dataset.side = "glb";
        span.dataset.idx = idx;
        span.dataset.entry = entryIdx;
        span.dataset.links = (glbLinks[idx] || []).join(",");
        glbRow.appendChild(span);
      });
      card.appendChild(glbRow);

      /* Target row */
      const tgtRow = document.createElement("div");
      tgtRow.className = "entry-row tgt-row";
      const tgtLabel = document.createElement("span");
      tgtLabel.className = "row-label";
      tgtLabel.textContent = (LANG_NAMES[data.lang] || data.lang).substring(0, 3).toUpperCase();
      tgtRow.appendChild(tgtLabel);
      entry.target_tokens.forEach((tok, idx) => {
        const span = document.createElement("span");
        span.className = "tok";
        span.textContent = tok;
        span.dataset.side = "tgt";
        span.dataset.idx = idx;
        span.dataset.entry = entryIdx;
        span.dataset.links = (tgtLinks[idx] || []).join(",");
        tgtRow.appendChild(span);
      });
      card.appendChild(tgtRow);

      /* Links pane: text display of pinned token's links */
      const linksPane = document.createElement("div");
      linksPane.className = "links-pane";
      linksPane.dataset.entry = entryIdx;
      linksPane.textContent = "";  // empty until a token is clicked
      card.appendChild(linksPane);

      entriesDiv.appendChild(card);
    });
  }

  /* ── Hover highlighting (event delegation) ──────────────── */
  function highlightLinks(tok, persistent) {
    const side      = tok.dataset.side;
    const entry     = tok.dataset.entry;
    const linksStr  = tok.dataset.links;
    const otherSide = side === "glb" ? "tgt" : "glb";
    const colors    = getColors();
    const colorIdx  = parseInt(tok.dataset.idx, 10) % colors.length;
    const bg        = colors[colorIdx];

    tok.style.background = bg;

    if (linksStr) {
      const linkedIdxs = linksStr.split(",");
      linkedIdxs.forEach(li => {
        const target = entriesDiv.querySelector(
          '.tok[data-entry="' + entry + '"][data-side="' + otherSide + '"][data-idx="' + li + '"]'
        );
        if (target) target.style.background = bg;
      });
    }
  }

  function clearHighlights(card) {
    if (!card) return;
    card.querySelectorAll(".tok").forEach(t => {
      if (!t.classList.contains("pinned-keep")) {
        t.style.background = "";
      }
    });
  }

  entriesDiv.addEventListener("mouseenter", e => {
    const tok = e.target.closest(".tok");
    if (!tok) return;
    /* Skip hover effects if a token in this card is pinned */
    const card = tok.closest(".entry-card");
    if (card && card.querySelector(".tok.pinned")) return;
    highlightLinks(tok, false);
  }, true);

  entriesDiv.addEventListener("mouseleave", e => {
    const tok = e.target.closest(".tok");
    if (!tok) return;
    const card = tok.closest(".entry-card");
    /* Skip clearing if a token in this card is pinned */
    if (card && card.querySelector(".tok.pinned")) return;
    clearHighlights(card);
  }, true);

  /* ── Click-to-pin: shows linked tokens persistently + lists them ──── */
  entriesDiv.addEventListener("click", e => {
    /* Ignore clicks on the Annotate link */
    if (e.target.closest(".entry-actions")) return;
    const tok = e.target.closest(".tok");
    if (!tok) return;

    const card = tok.closest(".entry-card");
    if (!card) return;

    const wasPinned = tok.classList.contains("pinned");
    /* Clear all pinned state in this card */
    card.querySelectorAll(".tok.pinned").forEach(t => t.classList.remove("pinned"));
    card.querySelectorAll(".tok").forEach(t => { t.style.background = ""; });

    const linksPane = card.querySelector(".links-pane");

    if (wasPinned) {
      /* Toggle off */
      if (linksPane) linksPane.textContent = "";
      return;
    }

    /* Pin this token: persistent highlight + display links as text */
    tok.classList.add("pinned");
    highlightLinks(tok, true);

    /* Build the links text */
    if (linksPane) {
      linksPane.innerHTML = "";
      const fromSpan = document.createElement("span");
      fromSpan.className = "from-tok";
      fromSpan.textContent = tok.textContent;
      linksPane.appendChild(fromSpan);

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "→";
      linksPane.appendChild(arrow);

      const linksStr = tok.dataset.links;
      const otherSide = tok.dataset.side === "glb" ? "tgt" : "glb";
      const entry = tok.dataset.entry;
      if (!linksStr) {
        const nul = document.createElement("span");
        nul.className = "to-tok null";
        nul.textContent = "(NULL — no link)";
        linksPane.appendChild(nul);
      } else {
        linksStr.split(",").forEach(li => {
          const target = entriesDiv.querySelector(
            '.tok[data-entry="' + entry + '"][data-side="' + otherSide + '"][data-idx="' + li + '"]'
          );
          if (target) {
            const t = document.createElement("span");
            t.className = "to-tok";
            t.textContent = target.textContent;
            linksPane.appendChild(t);
          }
        });
      }
    }
  });

})();
</script>
</body>
</html>
